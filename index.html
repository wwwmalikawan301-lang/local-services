<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rabta</title>
<meta name="theme-color" content="#0F6B4A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="rabta-192.png">
<style>
:root {
  --green: #0F6B4A; --green-d: #0A4A33; --green-t: #E5F2EC;
  --amber: #F2A93B; --amber-d: #3A2600;
  --bg: #F6F8F6; --card: #FFFFFF; --text: #16302A; --muted: #6B7D75; --line: #E3EAE6;
  --danger: #B3261E; --danger-t: #FDECEC; --wa: #157A3D; --wa-t: #E3F6EA;
  --shadow: 0 2px 10px rgba(10, 60, 40, 0.07);
  --r: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { overflow-x: hidden; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: 15px; color: var(--text); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

/* ===== Header ===== */
#hdr { background: var(--green); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 14px 16px; position: relative; }
#hdr.home { padding-bottom: 46px; border-radius: 0 0 26px 26px; }
.hrow { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.hbtn { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.14); color: #fff; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.htxt { flex: 1 1 auto; min-width: 0; }
.htxt h1 { font-size: 19px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.htxt p { font-size: 12.5px; opacity: 0.85; line-height: 1.4; }
#hdr.home .htxt h1 { font-size: 24px; }
.cpill { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.16); border-radius: 18px; padding: 7px 12px; font-size: 13px; font-weight: 500; max-width: 150px; }
.cpill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cpill svg.i { width: 16px; height: 16px; }

#app { padding: 14px 14px 0; display: flex; flex-direction: column; gap: 12px; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ===== Search ===== */
.sbox { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 4px 6px 4px 14px; box-shadow: var(--shadow); color: var(--muted); }
.sbox input { flex: 1 1 auto; width: 0; min-width: 0; border: 0; outline: 0; background: none; padding: 10px 0; }
.sbox input::placeholder { color: var(--muted); }
.sbox .clr { display: none; padding: 8px; color: var(--muted); }
.sbox .clr.show { display: flex; }
.fake { cursor: pointer; padding: 12px 16px; margin: -26px 14px 0; position: relative; z-index: 3; }
.fake span { font-size: 15px; }

/* ===== Cards, buttons ===== */
.h2 { font-size: 14.5px; font-weight: 600; margin: 4px 2px 0; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
.cat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 11px 2px 9px; text-align: center; font-size: 11.5px; font-weight: 500; line-height: 1.3; box-shadow: var(--shadow); }
.cat:active, .card:active { transform: scale(0.98); }
.cat .ci { width: 42px; height: 42px; margin: 0 auto 6px; border-radius: 14px; background: var(--green-t); color: var(--green); display: flex; align-items: center; justify-content: center; }
.note { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; font-size: 12.5px; color: var(--muted); }
.note svg.i { color: var(--green); width: 21px; height: 21px; }
.cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: var(--amber); color: var(--amber-d); font-weight: 600; font-size: 15px; padding: 14px; border-radius: 14px; box-shadow: 0 4px 12px rgba(242,169,59,0.35); }
.cta.green { background: var(--green); color: #fff; box-shadow: 0 4px 12px rgba(15,107,74,0.3); }
.link { color: var(--green); font-size: 13px; font-weight: 500; text-align: center; padding: 6px; }

.chips { display: flex; gap: 7px; overflow-x: auto; padding: 1px 0 3px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; background: var(--green-t); color: var(--green); border-radius: 18px; padding: 7px 14px; font-size: 13px; font-weight: 500; }
.chip.on { background: var(--green); color: #fff; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow); }
.prow { display: flex; gap: 11px; align-items: flex-start; cursor: pointer; }
.av { flex: 0 0 48px; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av.big { width: 84px; height: 84px; flex-basis: 84px; font-size: 32px; }
.pinfo { flex: 1 1 auto; min-width: 0; }
.pname { font-size: 15.5px; font-weight: 600; display: flex; align-items: center; gap: 5px; line-height: 1.35; }
.pname svg.i { width: 17px; height: 17px; color: var(--green); }
.pwork { font-size: 13px; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ploc { font-size: 12.5px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.ploc svg.i { width: 14px; height: 14px; }
.fav { flex: 0 0 auto; padding: 6px; color: var(--muted); }
.fav.on { color: #D4537E; }
.fav.on svg.i { fill: currentColor; }
.acts { display: flex; gap: 8px; margin-top: 11px; }
.btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 8px; border-radius: 12px; font-size: 14px; font-weight: 600; text-decoration: none; }
.btn svg.i { width: 18px; height: 18px; }
.btn.call { background: var(--green); color: #fff; }
.btn.wa { background: var(--wa-t); color: var(--wa); }
.btn.ok { background: var(--green); color: #fff; }
.btn.ed { background: #EEF1EF; color: var(--text); }
.btn.no { background: var(--danger-t); color: var(--danger); }
.btn.ghost { background: #EEF1EF; color: var(--text); }
.tag { display: inline-block; background: var(--green-t); color: var(--green); border-radius: 10px; padding: 2px 9px; font-size: 11.5px; font-weight: 500; margin-top: 4px; }
.bdg { display: inline-block; border-radius: 10px; padding: 2px 9px; font-size: 11.5px; background: #FFF3DC; color: #8A5A00; font-weight: 500; }

.empty { text-align: center; padding: 38px 18px; color: var(--muted); font-size: 14px; line-height: 1.8; }
.empty svg.i { width: 46px; height: 46px; color: #B9C9C0; margin-bottom: 6px; }
.empty .cta { margin-top: 14px; width: auto; display: inline-flex; padding: 12px 22px; }
.count { font-size: 12.5px; color: var(--muted); padding: 0 3px; }

/* ===== Form ===== */
.fld { margin-bottom: 12px; }
.fld label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
.inp { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; outline: 0; }
.inp:focus { border-color: var(--green); }
.inp.err { border-color: var(--danger); }
.ferr { font-size: 12px; color: var(--danger); margin-top: 4px; display: none; }
.ferr.show { display: block; }
.phrow { display: flex; gap: 8px; }
.phrow select { flex: 0 0 112px; }
.pics { display: flex; gap: 10px; margin-bottom: 14px; }
.pic { flex: 1; position: relative; background: var(--card); border: 1.5px dashed #B9C9C0; border-radius: 14px; min-height: 104px; padding: 10px 6px; text-align: center; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden; }
.pic svg.i { width: 26px; height: 26px; color: var(--green); }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pic input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted); margin: 4px 0 14px; line-height: 1.5; }
.chk input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--green); flex: 0 0 auto; }

/* ===== Tables / lists ===== */
.tt { width: 100%; border-collapse: collapse; font-size: 14px; }
.tt td { padding: 12px 6px; border-bottom: 1px solid var(--line); }
.tt tr:last-child td { border-bottom: 0; }
.tt td:last-child { text-align: right; font-weight: 600; }
.tt small { color: var(--muted); font-weight: 400; display: block; font-size: 12px; }
.nrow { display: flex; align-items: center; gap: 12px; }
.nrow .ci { width: 42px; height: 42px; border-radius: 12px; background: var(--danger-t); color: var(--danger); display: flex; align-items: center; justify-content: center; }
.nrow .ni { flex: 1 1 auto; min-width: 0; }
.nrow .nn { font-weight: 600; }
.nrow .ns { font-size: 12.5px; color: var(--muted); }
.nrow .btn { flex: 0 0 auto; padding: 10px 16px; }
.kv { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--muted); }

/* ===== Bottom nav ===== */
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--card); border-top: 1px solid var(--line); padding: 8px 6px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(0,0,0,0.05); }
#nav button { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); padding: 4px 2px; position: relative; }
#nav button svg.i { width: 24px; height: 24px; }
#nav button.on { color: var(--green); font-weight: 600; }
#nav button.on::before { content: ""; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); width: 26px; height: 3px; background: var(--amber); border-radius: 3px; }

/* ===== Sheet, toast ===== */
.ov { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
.ov.on { display: flex; }
.sheet { width: 100%; max-width: 520px; max-height: 82vh; overflow-y: auto; background: var(--card); border-radius: 22px 22px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .22s ease; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 { font-size: 17px; margin-bottom: 10px; }
.opt { display: flex; align-items: center; justify-content: space-between; padding: 14px 6px; border-bottom: 1px solid var(--line); font-size: 15px; }
.opt small { color: var(--muted); }
.opt.on { color: var(--green); font-weight: 600; }
#toast { position: fixed; bottom: calc(88px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(16px); background: #1d2e27; color: #fff; padding: 10px 18px; border-radius: 22px; font-size: 13.5px; opacity: 0; transition: .25s; z-index: 60; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; transform: translateX(-50%); }
.loading { text-align: center; padding: 50px 10px; color: var(--muted); }
</style>
</head>
<body>

<header id="hdr">
  <div class="hrow">
    <button class="hbtn" id="hBack" aria-label="Wapas" style="display:none"></button>
    <div class="htxt"><h1 id="hTitle"></h1><p id="hSub"></p></div>
    <div id="hRight"></div>
  </div>
</header>
<main id="app"><div class="loading">Load ho raha hai...</div></main>
<nav id="nav"></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ================== Bunyadi settings ================== */
const APP_NAME = "Rabta";
const TAGLINE = "Karigar aur gari, ek click par";

/* ================== Icons (line) ================== */
const ICONS = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
  userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>',
  arrowLeft: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  phoneCall: '<path d="M15.05 5A5 5 0 0 1 19 8.95M15.05 1A9 9 0 0 1 23 8.94"/><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  chat: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  verified: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>',
  camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
  chevron: '<polyline points="6 9 12 15 18 9"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  car: '<path d="M3 13l2-6a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 7l2 6v5H3z"/><circle cx="7.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/>',
  truck: '<rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  hammer: '<path d="M15 12l-8.5 8.5a2.12 2.12 0 0 1-3-3L12 9"/><path d="M17.64 15L22 10.64"/><path d="M20.91 11.7l-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01 4.6a5.56 5.56 0 0 0-3.94-1.64H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h2.47l2.26 1.91"/>',
  droplet: '<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>',
  zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  tool: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  bus: '<rect x="3" y="3" width="18" height="14" rx="3"/><path d="M3 11h18M7 17v3M17 17v3"/><circle cx="7.5" cy="14" r="0.8"/><circle cx="16.5" cy="14" r="0.8"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'
};
const ic = n => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || "") + '</svg>';
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

/* ================== Chhoti madad ================== */
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
let toastT = null;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400); }
const AV_COLORS = [["#E6F1FB", "#0C447C"], ["#FBEAF0", "#72243E"], ["#EAF3DE", "#27500A"], ["#FAEEDA", "#633806"], ["#E1F5EE", "#085041"], ["#EEEDFE", "#3C3489"]];
function avatar(p, big) {
  let h = 0; for (const c of p.name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const col = AV_COLORS[h % AV_COLORS.length];
  const inner = p.dpB64 ? '<img alt="" src="' + p.dpB64 + '">' : esc(p.name.trim().charAt(0).toUpperCase());
  return '<div class="av' + (big ? " big" : "") + '" style="background:' + col[0] + ";color:" + col[1] + '">' + inner + "</div>";
}
function waLink(num, text) { return "https://wa.me/" + String(num).replace(/\D/g, "") + (text ? "?text=" + encodeURIComponent(text) : ""); }

/* ================== Data ================== */
let DATA = null;
const DEMO_PENDING = "rb_pending", DEMO_APPROVED = "rb_approved", FAVS = "rb_favs", CITY = "rb_city";
function allProviders() { return DATA.providers.concat(lsGet(DEMO_APPROVED, [])); }
function catById(id) { return DATA.categories.find(c => c.id === id); }
function cityById(id) { return DATA.cities.find(c => c.id === id); }
function cityName(id) { const c = cityById(id); return c ? c.name : ""; }
function getFavs() { return lsGet(FAVS, []); }
function isFav(id) { return getFavs().includes(id); }
function toggleFav(id) { let f = getFavs(); f = f.includes(id) ? f.filter(x => x !== id) : f.concat(id); lsSet(FAVS, f); return f.includes(id); }
function selCity() { return lsGet(CITY, ""); }

/* ================== Navigation (history + scroll bahal) ================== */
let cur = null; // { view, params, d }
const VIEWS = {};
function go(view, params, opts) {
  opts = opts || {};
  params = params || {};
  if (cur && history.state) history.replaceState(Object.assign({}, history.state, { scroll: window.scrollY }), "");
  const st = { view, params, scroll: 0, d: opts.replace ? (cur ? cur.d : 0) : (cur ? cur.d + 1 : 0) };
  if (opts.replace) history.replaceState(st, ""); else history.pushState(st, "");
  show(st);
}
function show(st) {
  cur = { view: st.view, params: st.params || {}, d: st.d || 0 };
  $("ov").classList.remove("on");

/* ================== Tasveer chhoti karna ================== */
function compressImage(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
        let q = quality, out = cv.toDataURL("image/jpeg", q);
        while (out.length > 110000 && q > 0.35) { q -= 0.1; out = cv.toDataURL("image/jpeg", q); }
        resolve(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const COUNTRIES = [["+92", "PK"], ["+971", "UAE"], ["+966", "KSA"], ["+44", "UK"], ["+1", "US/CA"]];
function normPhone(cc, raw) {
  let d = String(raw || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  const ccd = cc.replace("+", "");
  if (d.startsWith(ccd) && d.length > ccd.length + 6) d = d.slice(ccd.length);
  if (d.startsWith("0")) d = d.slice(1);
  return { digits: d, full: cc + d };
}
function phoneOk(cc, d) { return cc === "+92" ? /^3\d{9}$/.test(d) : /^\d{7,12}$/.test(d); }

    hasErr = bad("fWork2", "eWork", work.length < 3) || hasErr;
    hasErr = bad("fPhone", "ePhone", !phoneOk(cc, ph.digits)) || hasErr;
    hasErr = bad("fWa", "eWa", !!wa && !phoneOk(cc, wa.digits)) || hasErr;
    hasErr = bad("fCity", "eCity", !city) || hasErr;
    hasErr = bad("fArea", "eArea", area.length < 2) || hasErr;
    const consent = $("fConsent").checked; $("eConsent").classList.toggle("show", !consent); hasErr = !consent || hasErr;
    if (hasErr) { toast("Ghalat ya khali jagah theek karein"); const f = document.querySelector(".inp.err, #eConsent.show"); if (f) f.scrollIntoView({ block: "center" }); return; }
    const rec = { id: "p" + Date.now(), name, categoryId: cat, tag: catById(cat).name, workText: work, phone: ph.full, whatsapp: wa ? wa.full : ph.full, city, area, dpB64: photos.dp, workPhotoB64: photos.work, consent: true, createdAt: new Date().toISOString() };
    const list = lsGet(DEMO_PENDING, []); list.push(rec);
    if (!lsSet(DEMO_PENDING, list)) { toast("Jagah kam hai, tasveer chhoti ya hata dein"); return; }
    go("added", {}, { replace: true });
  };
};
VIEWS.added = function () {
  setHeader({ title: "Shukriya", sub: "" });
  $("app").innerHTML = '<div class="empty">' + ic("verified") + "<div><b>Aap ki detail bhej di gayi hai.</b><br>Jaanch ke baad ye sab ko nazar aane lage gi.</div>" +
    '<button class="cta green" data-go="home">Home par jayein</button></div>';
};

/* ================== Admin (DEMO, login ke baghair) ================== */
VIEWS.admin = function (p) {
  const tab = p.tab || "pending";
  const pend = lsGet(DEMO_PENDING, []), appr = lsGet(DEMO_APPROVED, []);
  setHeader({ title: "Admin (demo)", sub: "Asli app mein sirf login ke baad", right: '<div class="hbtn">' + ic("lock") + "</div>" });
  const list = tab === "pending" ? pend : appr;
  $("app").innerHTML =
    '<div class="chips"><button class="chip ' + (tab === "pending" ? "on" : "") + '" data-tab="pending">Intezar mein (' + pend.length + ')</button><button class="chip ' + (tab === "approved" ? "on" : "") + '" data-tab="approved">Manzoor (' + appr.length + ")</button></div>" +
    (list.length ? list.map(x =>
      '<div class="card"><div class="prow" style="cursor:default">' + avatar(x) + '<div class="pinfo"><div class="pname">' + esc(x.name) + (tab === "pending" ? ' <span class="bdg">Naya</span>' : "") + "</div>" +
      '<div class="pwork">' + esc(x.workText) + '</div><div class="ploc">' + esc(x.phone) + "</div>" +
      '<div class="ploc">' + ic("pin") + esc(x.area + ", " + cityName(x.city)) + "</div></div></div>" +
      (x.workPhotoB64 ? '<img alt="" src="' + x.workPhotoB64 + '" style="width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-top:10px;display:block">' : "") +
      (tab === "pending" ? '<div class="acts"><button class="btn ok" data-a="ok" data-id="' + x.id + '">' + ic("check") + 'Manzoor</button><button class="btn ed" data-a="ed" data-id="' + x.id + '">' + ic("pencil") + 'Tabdeel</button><button class="btn no" data-a="no" data-id="' + x.id + '">' + ic("x") + "Radd</button></div>"
        : '<div class="acts"><button class="btn no" data-a="del" data-id="' + x.id + '">' + ic("x") + "Hatayein</button></div>") + "</div>").join("")
      : emptyBox(tab === "pending" ? "Koi nayi darkhwast nahi.<br>Pehle 'Apni detail add karein' se ek bhej kar dekhein." : "Abhi koi manzoor shuda nahi.", false));
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { saveParams({ tab: b.dataset.tab }); VIEWS.admin(cur.params); });
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const id = b.dataset.id, a = b.dataset.a;
    if (a === "ok") { const rec = pend.find(r => r.id === id); lsSet(DEMO_PENDING, pend.filter(r => r.id !== id)); rec.approvedAt = new Date().toISOString(); appr.push(rec); lsSet(DEMO_APPROVED, appr); toast("Manzoor ho gaya"); VIEWS.admin(cur.params); }
    else if (a === "no") { if (confirm("Ye darkhwast radd karein?")) { lsSet(DEMO_PENDING, pend.filter(r => r.id !== id)); toast("Radd kar diya"); VIEWS.admin(cur.params); } }
    else if (a === "del") { if (confirm("Ye record hata dein?")) { lsSet(DEMO_APPROVED, appr.filter(r => r.id !== id)); toast("Hata diya"); VIEWS.admin(cur.params); } }
    else if (a === "ed") {
      const rec = pend.find(r => r.id === id);
      $("sheet").innerHTML = "<h2>Tabdeel karein</h2>" +
        '<div class="fld"><label>Naam</label><input class="inp" id="eN" value="' + esc(rec.name) + '"></div>' +
        '<div class="fld"><label>Kaam ki tafseel</label><input class="inp" id="eW" value="' + esc(rec.workText) + '"></div>' +
        '<div class="fld"><label>Gaon / mohalla</label><input class="inp" id="eA" value="' + esc(rec.area) + '"></div>' +
        '<button class="cta green" id="eSave">Mehfooz karein</button>';
      $("ov").classList.add("on");
      $("eSave").onclick = () => { rec.name = $("eN").value.trim() || rec.name; rec.workText = $("eW").value.trim() || rec.workText; rec.area = $("eA").value.trim() || rec.area; lsSet(DEMO_PENDING, pend); $("ov").classList.remove("on"); toast("Tabdeel ho gaya"); VIEWS.admin(cur.params); };
    }
  });
};

/* ================== Shuruaat ================== */
fetch("sample.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  DATA = d;
  const st = history.state && history.state.view ? history.state : { view: "home", params: {}, scroll: 0, d: 0 };
  history.replaceState(st, "");
  show(st);
}).catch(() => {
  $("app").innerHTML = '<div class="empty"><div>Data load nahi hua. Internet check karein.</div><button class="cta green" onclick="location.reload()">Dobara koshish karein</button></div>';
});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
